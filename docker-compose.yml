services:
  postgres:
    image: postgres:17-alpine
    container_name: almo-erp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-almo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-almo_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-almo_erp}
      TZ: America/Sao_Paulo
      PGTZ: America/Sao_Paulo
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - almo-erp-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-almo} -d ${POSTGRES_DB:-almo_erp}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  almo-erp-pgdata:
    name: almo-erp-pgdata
