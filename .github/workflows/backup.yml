name: Backup

# Cópia SECUNDÁRIA e CIFRADA do banco.
#
# Entra por SSH na VPS e tira o dump de DENTRO do container do Postgres — o
# banco nunca fica exposto na internet. O dump é cifrado (AES256) antes de ser
# guardado como artefato do workflow.
#
# O backup PRINCIPAL é o do Dokploy → S3 (retenção longa). Este aqui é uma
# segunda cópia, em outro provedor, com retenção curta — por isso 14 dias.
#
# Manual: botão "Run workflow". Agendado: 07:00 UTC (04:00 BRT).
on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

concurrency:
  group: backup-db
  cancel-in-progress: false

jobs:
  dump:
    name: Dump cifrado via SSH
    # `ubuntu-24.04` explícito, não `ubuntu-latest`: o rótulo `latest` migra para
    # Ubuntu 26 em 19/out/2026, e uma mudança de ambiente não pode chegar de
    # surpresa num workflow que publica produção. Trocar de imagem é decisão
    # nossa, tomada aqui e testada — não um efeito colateral de data.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Validar secrets
        id: secrets
        env:
          HOST: ${{ secrets.SSH_HOST }}
          SSHUSER: ${{ secrets.SSH_USER }}
          KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          CONTAINER: ${{ secrets.POSTGRES_CONTAINER }}
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          faltando=""
          for v in HOST SSHUSER KEY CONTAINER PASS; do
            [ -z "${!v:-}" ] && faltando="$faltando $v"
          done

          if [ -n "$faltando" ]; then
            # Não configurado **não** é falha — é ausência de configuração, e
            # falhar todo dia às 07:00 só produz ruído vermelho e a impressão de
            # que existe um backup. O que este passo não pode fazer é fingir:
            # o aviso diz, em texto, que nenhum dump foi tirado.
            #
            # A distinção importa: configurado e quebrado continua falhando alto.
            {
              echo "### ⚠️ Backup secundário NÃO configurado"
              echo
              echo "**Nenhum backup foi tirado por este workflow.**"
              echo
              echo "Faltam os secrets:$faltando"
              echo
              echo "Configure em Settings → Secrets and variables → Actions."
              echo "O backup principal (Dokploy → S3) não depende disto."
            } >> "$GITHUB_STEP_SUMMARY"

            echo "::warning::Backup secundário não configurado — faltam:$faltando. NENHUM backup foi tirado."
            echo "configurado=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "configurado=true" >> "$GITHUB_OUTPUT"

      - name: Preparar a chave SSH
        if: steps.secrets.outputs.configurado == 'true'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Gerar e cifrar o dump
        if: steps.secrets.outputs.configurado == 'true'
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          POSTGRES_CONTAINER: ${{ secrets.POSTGRES_CONTAINER }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          mkdir -p backups
          STAMP="$(date +%Y%m%d-%H%M%S)"
          DUMP="backups/almo_erp-$STAMP.dump"

          # `-T` (sem TTY) para o binário passar intacto pelo SSH.
          # As credenciais vêm do próprio ambiente do container do Postgres.
          ssh -T -i ~/.ssh/id_deploy "$SSH_USER@$SSH_HOST" \
            "docker exec '$POSTGRES_CONTAINER' sh -c 'pg_dump -U \$POSTGRES_USER -d \$POSTGRES_DB -Fc'" \
            > "$DUMP"

          # Cifra antes de sair da máquina: o artefato vai ilegível para o GitHub.
          umask 077
          printf '%s' "$BACKUP_PASSPHRASE" > /tmp/pass
          gpg --symmetric --cipher-algo AES256 --batch --yes \
            --passphrase-file /tmp/pass -o "$DUMP.gpg" "$DUMP"
          rm -f /tmp/pass "$DUMP"

          ls -lh backups

      - name: Publicar o artefato cifrado
        if: steps.secrets.outputs.configurado == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: almo-erp-dump-${{ github.run_id }}
          path: backups/*.gpg
          retention-days: 14
          if-no-files-found: error

# Restauração (guarde a passphrase em local seguro):
#   gpg --batch --yes --passphrase-file <arquivo> -d almo_erp-<data>.dump.gpg > dump
#   pg_restore -d "postgresql://..." --clean --if-exists dump
