name: Deploy

# Dispara o deploy no Dokploy quando o CI passa na `main`.
# O Dokploy builda a imagem (Dockerfile) e sobe; as migrations rodam no
# entrypoint do container. Detalhes em docs/DEPLOY.md.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Um deploy por vez; nunca cancela um deploy em andamento.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  trigger:
    name: Disparar deploy no Dokploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Só segue se o CI passou (ou se foi disparo manual).
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    environment: production
    steps:
      - name: Exigir o webhook do Dokploy
        env:
          HOOK: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::Defina o secret DOKPLOY_WEBHOOK_URL (Dokploy → Application → Deployments → Webhook)."
            exit 1
          fi

      # O CI já rodou; aqui só pedimos ao Dokploy para buildar e subir.
      # As migrations acontecem no entrypoint do container, antes do Next servir.
      - name: Chamar o webhook de deploy
        env:
          HOOK: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/dokploy-response -w '%{http_code}' -X POST "$HOOK")
          echo "HTTP $code"
          cat /tmp/dokploy-response 2>/dev/null || true
          if [ "$code" != "200" ]; then
            echo "::error::O Dokploy recusou o deploy (HTTP $code)."
            exit 1
          fi
