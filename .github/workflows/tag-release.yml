name: Release automática

# Versionamento automático: todo push na `main` que tenha commit no formato
# Conventional Commits ganha uma versão nova e uma tag, sem ninguém lembrar de
# bumper o `package.json`.
#
# A regra está em `src/lib/release.ts` (pura, 100% testada); este workflow só
# executa `scripts/release.mts`, que fala com o git.
#
#     feat:      → minor
#     fix/perf/refactor/revert: → patch
#     breaking (`!` ou `BREAKING CHANGE:`) → major
#     docs/chore/test/ci:     → não publica
#
# Consequência para o deploy: o Dokploy pode passar a publicar **por tag**, que
# é mais estável que acompanhar a `main` — ver `docs/DEPLOY.md`.
on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  # `cancel-in-progress: false` é obrigatório: cancelar o release no meio
  # deixaria a `main` com o `package.json` já bumpado e sem tag.
  group: tag-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Decidir versão, commitar e taguear
    runs-on: ubuntu-latest
    # Regra do AGENTS §9.1: nenhum job passa de 5 minutos.
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # `fetch-depth: 0` traz histórico e tags: o bump é calculado sobre os
          # commits desde a última tag, então sem isso não há o que ler.
          # `ref: main` evita que o runner faça checkout detached e o `push`
          # do commit de release seja rejeitado por não estar numa branch.
          ref: main
          fetch-depth: 0

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Não roda `pnpm install`: o script usa o stripping de tipos do Node e
      # importa apenas a decisão pura, que não depende de nada. Instalar o
      # projeto inteiro aqui comeria minutos do teto de 5.

      - name: Decidir a versão, commitar e publicar a tag
        run: node --experimental-strip-types scripts/release.mts
        env:
          PUSH: "1"
          PUSH_BRANCH: main
