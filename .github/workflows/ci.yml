name: Qualidade (manual)

# NÃO roda em push nem em pull request. É opcional e disparado à mão.
#
# Motivo: o portão de qualidade real é o hook `pre-push`, que roda
# `lint + typecheck + test + build` na máquina antes de qualquer push. Rodar a
# mesma coisa no GitHub só duplicaria o gasto de minutos do plano gratuito — o
# plano Free dá 2.000 min/mês para repositório privado, e este projeto não tem
# por que queimá-los num check que já passou localmente.
#
# Use este workflow quando quiser uma segunda opinião em outro ambiente (por
# exemplo, antes de uma release ou depois de mexer no Postgres).
on:
  workflow_dispatch:

# Um push novo cancela o run anterior da mesma ref: nunca fica fila acumulada.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Valores de teste: nunca use segredos reais no CI.
  DATABASE_URL: postgresql://almo:almo_dev_password@localhost:5432/almo_erp?schema=public
  AUTH_SECRET: ci-secret-nao-usar-em-producao
  AUTH_ALLOWED_DOMAINS: exemplo.com.br
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  AUTH_TRUST_HOST: "true"

jobs:
  quality:
    name: Qualidade (lint, tipos, testes, build)
    # `ubuntu-24.04` explícito, não `ubuntu-latest`: o rótulo `latest` migra para
    # Ubuntu 26 em 19/out/2026, e uma mudança de ambiente não pode chegar de
    # surpresa num workflow que publica produção. Trocar de imagem é decisão
    # nossa, tomada aqui e testada — não um efeito colateral de data.
    runs-on: ubuntu-24.04
    # REGRA: nenhum job de CI passa de 5 minutos. O teto é o próprio contrato:
    # se estourar, falha rápido em vez de pendurar por 30.
    timeout-minutes: 5

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: almo
          POSTGRES_PASSWORD: almo_dev_password
          POSTGRES_DB: almo_erp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U almo -d almo_erp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar pnpm
        uses: pnpm/action-setup@v6

      - name: Configurar Node
        uses: actions/setup-node@v7
        with:
          # Node 24 LTS, igual à imagem de produção (Dockerfile). O 22 virou
          # maintenance; rodar o mesmo major em CI e runtime evita divergência.
          node-version: 24
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile
        timeout-minutes: 3

      - name: Lint
        run: pnpm lint
        timeout-minutes: 2

      - name: Typecheck
        run: pnpm typecheck
        timeout-minutes: 2

      - name: Aplicar migrations
        run: pnpm db:deploy
        timeout-minutes: 2

      - name: Seed
        run: pnpm db:seed
        timeout-minutes: 2
        env:
          SEED_ADMIN_EMAIL: admin@exemplo.com.br

      - name: Testes
        run: pnpm test
        timeout-minutes: 3

      - name: Build
        run: pnpm build
        timeout-minutes: 3
