name: CI

# Apenas `main` dispara CI. `develop` e branches de trabalho não rodam nada.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Um push novo cancela o run anterior da mesma ref: nunca fica fila acumulada.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Valores de teste: nunca use segredos reais no CI.
  DATABASE_URL: postgresql://almo:almo_dev_password@localhost:5432/almo_erp?schema=public
  AUTH_SECRET: ci-secret-nao-usar-em-producao
  AUTH_ALLOWED_DOMAINS: exemplo.com.br
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  AUTH_TRUST_HOST: "true"

jobs:
  quality:
    name: Qualidade (lint, tipos, testes, build)
    runs-on: ubuntu-latest
    # REGRA: nenhum job de CI passa de 5 minutos. O teto é o próprio contrato:
    # se estourar, falha rápido em vez de pendurar por 30.
    timeout-minutes: 5

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: almo
          POSTGRES_PASSWORD: almo_dev_password
          POSTGRES_DB: almo_erp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U almo -d almo_erp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar pnpm
        uses: pnpm/action-setup@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile
        timeout-minutes: 3

      - name: Lint
        run: pnpm lint
        timeout-minutes: 2

      - name: Typecheck
        run: pnpm typecheck
        timeout-minutes: 2

      - name: Aplicar migrations
        run: pnpm db:deploy
        timeout-minutes: 2

      - name: Seed
        run: pnpm db:seed
        timeout-minutes: 2
        env:
          SEED_ADMIN_EMAIL: admin@exemplo.com.br

      - name: Testes
        run: pnpm test
        timeout-minutes: 3

      - name: Build
        run: pnpm build
        timeout-minutes: 3
