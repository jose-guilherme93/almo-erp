name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Valores de teste: nunca use segredos reais no CI.
  DATABASE_URL: postgresql://almo:almo_dev_password@localhost:5432/almo_erp?schema=public
  AUTH_SECRET: ci-secret-nao-usar-em-producao
  AUTH_ALLOWED_DOMAINS: exemplo.com.br
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  AUTH_TRUST_HOST: "true"

jobs:
  quality:
    name: Lint, tipos, testes e build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: almo
          POSTGRES_PASSWORD: almo_dev_password
          POSTGRES_DB: almo_erp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U almo -d almo_erp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar pnpm
        uses: pnpm/action-setup@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Aplicar migrations
        run: pnpm db:deploy

      - name: Seed
        run: pnpm db:seed
        env:
          SEED_ADMIN_EMAIL: admin@exemplo.com.br

      - name: Testes
        run: pnpm test

      - name: Build
        run: pnpm build

  e2e:
    name: Testes end-to-end
    runs-on: ubuntu-latest
    needs: quality

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: almo
          POSTGRES_PASSWORD: almo_dev_password
          POSTGRES_DB: almo_erp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U almo -d almo_erp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar pnpm
        uses: pnpm/action-setup@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Aplicar migrations
        run: pnpm db:deploy

      - name: Seed
        run: pnpm db:seed
        env:
          SEED_ADMIN_EMAIL: admin@exemplo.com.br

      - name: Instalar navegadores do Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Rodar e2e
        run: pnpm e2e --project=chromium
        env:
          # Liga o provider de credenciais usado só pelos testes. O
          # src/lib/env.ts recusa esta combinação se NODE_ENV=production.
          E2E_AUTH_BYPASS: "true"

      - name: Publicar relatório do Playwright
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
