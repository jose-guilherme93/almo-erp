# Produção: app + Postgres + Caddy no mesmo host.
#
# Suba sempre com o arquivo de segredos explícito, para o Compose interpolar as
# variáveis a partir dele (e não do `.env` de desenvolvimento):
#
#   docker compose --env-file .env.production -f docker-compose.prod.yml up -d
#
# O Postgres não publica porta no host: só o `app` fala com ele pela rede interna.

name: almo-erp

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER no .env.production}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env.production}
      POSTGRES_DB: ${POSTGRES_DB:-almo_erp}
      TZ: America/Sao_Paulo
      PGTZ: America/Sao_Paulo
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-almo_erp}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-almo-erp}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?defina NEXT_PUBLIC_APP_URL no .env.production}
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    expose:
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?defina DOMAIN no .env.production}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  pgdata:
    name: almo-erp-prod-pgdata
  uploads:
    name: almo-erp-prod-uploads
  caddy_data:
    name: almo-erp-prod-caddy-data
  caddy_config:
    name: almo-erp-prod-caddy-config
